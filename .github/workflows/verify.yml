name: RFB Studio - verificar branch
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências (regerar lockfile desta etapa)
        run: npm install --no-audit --no-fund
      - name: Capturar lockfile atualizado para versionamento
        run: |
          echo 'RFBS_LOCKFILE_START'
          base64 -w 76 package-lock.json
          echo 'RFBS_LOCKFILE_END'
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Build Vite
        run: npm run build
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Rules no Emulator isolado
        run: npm run rules:test
      - name: Guardar build estático para revisão
        uses: actions/upload-artifact@v4
        with:
          name: rfb-studio-dist
          path: dist/
          retention-days: 7
      - name: Instalar Chromium para QA E2E
        run: npx playwright install --with-deps chromium
      - name: QA E2E navegador real
        run: npm run e2e
      - name: Publicar capturas de QA sem dados pessoais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfb-studio-browser-qa
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
